# Shell-direct cron jobs (systemd user timers, no agentTurn LLM wrapper).
# Installed by: OPENCLAW_SUBARU_ROOT=$PWD python3 scripts/install-openclaw-shell-cron.sh
# Paths use ${OPENCLAW_DIR} — expanded at install time.
jobs:
  - id: b2c3d4e5-subaru-status-alert
    name: subaru-status-alert
    script: ${OPENCLAW_DIR}/scripts/subaru-status-alert.sh
    success_grep: SUBARU_ALERT
    schedule: "0 */6 * * *"
    tz: America/Los_Angeles
